<!doctype html>
<html lang="uz">
  <head>

      <div id="today-stats" class="today-stats hidden"></div>

      <div id="queue-stats" class="queue-stats hidden"></div>

      <div id="offline-banner" class="offline-banner hidden">
        <span class="offline-dot"></span> Aloqa yo'q — qayta urinilmoqda…
      </div>

      <main id="queue-list" class="queue-list">
        <div class="skeleton-card"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
